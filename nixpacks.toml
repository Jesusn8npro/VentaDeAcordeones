# EasyPanel / Nixpacks — Next.js 16 (requiere Node >=20.9)
[variables]
NODE_ENV = "production"
PORT = "3000"
# El build de Next se come mucha memoria y el contenedor lo mata sin dejar mas rastro
# que un "exit code 137". AcademiaNext (que si despliega) lleva esta variable; este
# proyecto no la tenia.
NODE_OPTIONS = "--max-old-space-size=4096"

# IMPORTANTE: las NEXT_PUBLIC_* se incrustan en el bundle del navegador en el
# BUILD. EasyPanel solo inyecta sus envs en runtime, no en build → por eso
# quedaban como placeholder. Aquí se garantizan en build. Son valores PÚBLICOS
# (la anon key está protegida por RLS; URL y public key de ePayco son públicas;
# se envían al navegador igualmente). NO pongas aquí secretos (service_role,
# EPAYCO_PRIVATE_KEY): esos van solo como env de EasyPanel (se leen en runtime).
NEXT_PUBLIC_SUPABASE_URL = "https://dxcpzivxzxvhabdimemb.supabase.co"
NEXT_PUBLIC_SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR4Y3B6aXZ4enh2aGFiZGltZW1iIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY4NDgyMDcsImV4cCI6MjA4MjQyNDIwN30.tevoIAGE363woAt_DnK7R9hhZ-yrn-d8UTFzJfrP0Hc"
NEXT_PUBLIC_EPAYCO_PUBLIC_KEY = "a04d60e2e678d5bd89a58d26f3413fdb"
NEXT_PUBLIC_EPAYCO_TEST_MODE = "false"
NEXT_PUBLIC_EPAYCO_ENVIRONMENT = "production"
NEXT_PUBLIC_EPAYCO_URL_RESPONSE = "https://ventadeacordeones.com/respuesta-epayco"
# Confirmación servidor-a-servidor: ePayco hace POST a esta URL y es lo ÚNICO que marca
# un pedido como pagado. Antes apuntaba a /confirmacion-epayco, una página de React que
# nunca llegó a ejecutarse desde el servidor de ePayco → ningún pago se confirmaba.
NEXT_PUBLIC_EPAYCO_URL_CONFIRMATION = "https://ventadeacordeones.com/api/epayco/confirmar"

# Google Analytics 4. Va aqui y no solo en el panel porque las NEXT_PUBLIC_* se
# incrustan en el BUILD: si solo estuviera como env de EasyPanel, el bundle saldria
# sin ID y no se registraria ni una visita.
NEXT_PUBLIC_GA_ID = "G-BR165RMQ66"

# MODO MANTENIMIENTO (gate por login). "true" = el publico ve "Estamos actualizando"
# y SOLO el admin logueado ve la tienda. Cualquier otro valor = tienda abierta.
#
# La variable se llama distinto desde el 2026-09-11: NEXT_PUBLIC_MODO_MANTENIMIENTO se
# quedo en "true" en el panel de EasyPanel y mantenia la tienda cerrada aunque aqui
# dijera "false". Si la vieja sigue definida en el panel, ya no hace nada.
NEXT_PUBLIC_MANTENIMIENTO_ACTIVO = "false"

# nixpkgsArchive fija una revisión con nodejs_22 (evita "undefined variable 'nodejs_22'").
# vips/pkg-config: necesarios si se reactiva la optimización de imágenes de Next.
[phases.setup]
nixpkgsArchive = "51ad838b03a05b1de6f9f2a0fffecee64a9788ee"
nixPkgs = ["nodejs_22", "python3", "pkg-config", "vips"]

# NODE_ENV=production hace que npm omita devDependencies; --include=dev las fuerza
# (Next se necesita para build).
[phases.install]
cmds = ["npm install --include=dev --no-audit --no-fund"]

[phases.build]
# `cmds` (lista), no `cmd`: con la clave equivocada Nixpacks ignora la fase y usa
# la que detecta por su cuenta. AcademiaNext usa `cmds` y despliega bien.
cmds = ["npm run build"]

[start]
cmd = "npm run start"

# .node-version y .nvmrc (ambos con "22") acompanan a este archivo a proposito:
# si EasyPanel ignora el nixpkgsArchive de arriba —cosa que hace a veces—, Nixpacks
# cae a Node 20.6.1 y Next 16 exige >= 20.9, asi que el build revienta. Esos dos
# ficheros son la red de seguridad que si respeta siempre.
